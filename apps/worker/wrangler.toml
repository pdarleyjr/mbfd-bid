name = "mbfd-bid-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare account ID set via env var: CLOUDFLARE_ACCOUNT_ID
# Token via wrangler login OR CLOUDFLARE_API_TOKEN

[env.staging]
name = "mbfd-bid-worker-staging"
# Workers Custom Domain (dedicated cert via Cloudflare's auto-provisioning).
# Replaces the legacy `route = { pattern = "...", zone_name = "..." }` which
# relied on Universal SSL that did not reissue to cover this 4th-level host.
routes = [{ pattern = "api.staging.bid.mbfdhub.com", custom_domain = true }]
# Read-only portal authentication remains available through PORTAL_BASE_URL.
# Outbound bid publication is a separate, explicit capability and staging must
# not obtain it merely by having a queue binding.
vars = { ENV = "staging", PORTAL_BASE_URL = "https://staging.mbfdhub.com", PORTAL_WRITEBACK_ENABLED = "false", PORTAL_WRITEBACK_BASE_URL = "https://portal-writeback-disabled.invalid", R2_EXPORTS_BUCKET_NAME = "mbfd-bid-exports-staging-v2" }

[[env.staging.d1_databases]]
binding = "DB"
database_name = "mbfd-bid-staging"
database_id = "6dd16e65-5cb6-4c19-aff2-ec2706e72d50"
migrations_dir = "./migrations"

[[env.staging.kv_namespaces]]
binding = "KV"
id = "ce8afe4605464683a51bf6ae9c042c01"

[[env.staging.durable_objects.bindings]]
name = "BID_SESSION"
class_name = "BidSessionDO"

[[env.staging.migrations]]
tag = "v1"
new_classes = ["BidSessionDO"]

# Dedicated staging-only buckets avoid ambiguous use by other account resources.
[[env.staging.r2_buckets]]
binding = "R2_AUDIT"
bucket_name = "mbfd-bid-audit-staging-v2"

[[env.staging.r2_buckets]]
binding = "R2_EXPORTS"
bucket_name = "mbfd-bid-exports-staging-v2"

# Browser Rendering (replaces Browserless): used by exports/roster-pdf.ts to
# render the print-stylesheet RSC page to PDF via @cloudflare/puppeteer.
# Included on the Workers Paid plan; no external token required.
[env.staging.browser]
binding = "BROWSER"

# Plan 08: Queues
[[env.staging.queues.producers]]
binding = "PORTAL_QUEUE"
queue = "mbfd-portal-writebacks-staging"

[env.production]
name = "mbfd-bid-worker-production"
routes = [{ pattern = "api.bid.mbfdhub.com", custom_domain = true }]
# Production publication remains disabled until a separate, accountable
# configuration change explicitly sets a writer, endpoint, and literal true.
vars = { ENV = "production", PORTAL_BASE_URL = "https://www.mbfdhub.com", PORTAL_WRITEBACK_ENABLED = "false", PORTAL_WRITEBACK_BASE_URL = "https://portal-writeback-disabled.invalid", R2_EXPORTS_BUCKET_NAME = "mbfd-bid-exports-production-v2" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "mbfd-bid-production"
database_id = "df132142-f00a-45a5-b981-68a94861473f"
migrations_dir = "./migrations"

[[env.production.kv_namespaces]]
binding = "KV"
id = "ba5cd8a0c10d4cae9bb968272f0879cf"

[[env.production.durable_objects.bindings]]
name = "BID_SESSION"
class_name = "BidSessionDO"

[[env.production.migrations]]
tag = "v1"
new_classes = ["BidSessionDO"]

# Plan 08: R2 buckets
[[env.production.r2_buckets]]
binding = "R2_AUDIT"
bucket_name = "mbfd-bid-audit-production-v2"

[[env.production.r2_buckets]]
binding = "R2_EXPORTS"
bucket_name = "mbfd-bid-exports-production-v2"

# Browser Rendering (replaces Browserless): used by exports/roster-pdf.ts to
# render the print-stylesheet RSC page to PDF via @cloudflare/puppeteer.
# Included on the Workers Paid plan; no external token required.
[env.production.browser]
binding = "BROWSER"

# No production Queue binding is declared. Writeback is disabled, its writer
# credential is intentionally absent, and an external-writeback consumer count
# must remain zero until an independently authorized future release.

[triggers]
# Plan 08: 04:15 UTC daily portal reconciliation.
crons = ["15 4 * * *"]

# Secrets — set via `wrangler secret put NAME --env staging`:
#   JWT_SIGNING_KEY        (HMAC HS256, 32-byte random base64url)
#   TELESTAFF_HMAC_KEY     (dedicated 32-byte source-reference HMAC key;
#                           required before the manual TeleStaff upload route
#                           can stage an import; never reuse JWT_SIGNING_KEY)
#   PORTAL_BID_FEDERATION_TOKEN (dedicated service token for Hub authorization
#                              code exchange and identity revalidation)
#   PORTAL_BID_WRITER      (production-only service token for /bid-assignment;
#                           it must remain absent from staging)
#   AUDIT_SIGNING_PRIVKEY  (Plan 08 — ed25519 32-byte base64url; per year per env)
#   AUDIT_SIGNING_PUBKEY   (Plan 08 — ed25519 32-byte base64url; non-secret)
#   BROWSERLESS_TOKEN      (DEPRECATED — replaced by Cloudflare Browser
#                           Rendering binding [browser]/BROWSER. Safe to
#                           unset after the next deploy.)
