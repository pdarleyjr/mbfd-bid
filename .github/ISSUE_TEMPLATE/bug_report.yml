name: 🐛 Bug report
description: Something works incorrectly during the bid or in the admin panel.
title: '[Bug] '
labels: [bug, needs-triage]
assignees: [pdarleyjr]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please fill in every field — issues missing
        reproduction steps are auto-closed.

        **If this is a security issue, do NOT open a public issue.**
        See [`SECURITY.md`](https://github.com/pdarleyjr/mbfd-bid/blob/main/SECURITY.md).

  - type: dropdown
    id: surface
    attributes:
      label: Which surface?
      options:
        - Member draft view
        - Admin live console
        - Admin dashboard
        - Audit log viewer
        - AI advisory panel
        - Authentication / PIN gate
        - Imports (members / credentials)
        - Portal write-back
        - Other / unsure
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - 'P0 — bid is blocked / data loss'
        - 'P1 — major feature broken, no workaround'
        - 'P2 — major feature broken, workaround exists'
        - 'P3 — minor / cosmetic'
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Exact sequence of actions that triggers the bug.
      placeholder: |
        1. Log in as member X
        2. Click Y on /draft
        3. Observe Z
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: bid-session
    attributes:
      label: Bid session ID (if known)
      placeholder: 01HF3...
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Browser + version
      placeholder: e.g. Safari 17.5 on iPhone 14
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Console errors, network responses, or screenshots. Redact any PII.
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I confirmed this is reproducible and not a one-off network glitch.
          required: true
        - label: I redacted any employee names / IDs that aren't relevant.
          required: true
