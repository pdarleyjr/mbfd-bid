name: D1 backup

# Plan 09 Task 6 — scheduled D1 snapshots to R2.
#
# Runs every 6 hours by default; switch the cron to 15 minutes during the
# live bid week. `workflow_dispatch` allows the operator to trigger an
# ad-hoc backup before risky operations.

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:
    inputs:
      env:
        description: staging | production
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: d1-backup-${{ github.event_name == 'workflow_dispatch' && inputs.env || 'scheduled' }}
  cancel-in-progress: false

env:
  PNPM_VERSION: 9.12.0
  NODE_VERSION: 22.x

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    strategy:
      fail-fast: false
      matrix:
        # Scheduled runs only back up staging; production matrix entry is
        # added by Plan 09b once production D1 + R2 backups bucket exist.
        # Use workflow_dispatch with env=production to back up prod ad-hoc.
        env: ${{ github.event_name == 'workflow_dispatch' && fromJson(format('["{0}"]', inputs.env)) || fromJson('["staging"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run backup
        shell: pwsh
        run: |
          $db = if ("${{ matrix.env }}" -eq "production") { "mbfd-bid-production" } else { "mbfd-bid-staging" }
          $bucket = if ("${{ matrix.env }}" -eq "production") { "mbfd-bid-prod-backups" } else { "mbfd-bid-staging-backups" }
          ./scripts/d1-backup.ps1 -Env ${{ matrix.env }} -DbName $db -BucketName $bucket
