name: D1 backup

# Production snapshots are explicitly dispatched before authorized operations.
# The retired environment's schedule is removed; this does not add scheduled
# production work.

on:
  workflow_dispatch:
    inputs:
      env:
        description: Explicit production backup scope
        required: true
        default: production
        type: choice
        options:
          - production

permissions:
  contents: read

concurrency:
  group: d1-backup-production
  cancel-in-progress: false

env:
  PNPM_VERSION: 9.12.0
  NODE_VERSION: 22.x

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run backup
        shell: pwsh
        run: |
          if ('${{ inputs.env }}' -ne 'production') { throw 'Explicit production backup scope is required.' }
          ./scripts/d1-backup.ps1 -Env production -DbName mbfd-bid-production -BucketName mbfd-bid-prod-backups
