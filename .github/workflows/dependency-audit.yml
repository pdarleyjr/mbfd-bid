name: Dependency audit

# Plan 09 Task 7 — weekly pnpm audit for high+critical CVE advisories on
# production dependencies. Reports failures; does not auto-block merges
# (kept separate from `ci.yml` so a new CVE published on Sunday night
# doesn't immediately block a Monday morning hotfix).

on:
  schedule:
    - cron: '0 13 * * 1'   # Mondays 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  PNPM_VERSION: 9.12.0
  NODE_VERSION: 22.x

jobs:
  audit:
    name: pnpm audit --prod --audit-level=high
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run audit
        run: pnpm audit --prod --audit-level=high
