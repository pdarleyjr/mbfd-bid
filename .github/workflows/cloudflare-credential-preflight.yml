name: Cloudflare credential preflight

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PNPM_VERSION: 9.12.0
  NODE_VERSION: 22.x

jobs:
  production-preflight:
    name: Verify production credential and deployment guards without deploying
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify stored token and expected account and Worker access
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !accountId) throw new Error('Cloudflare deployment secret or account ID is missing');
          async function requireCloudflare(path) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              headers: { Authorization: `Bearer ${token}` },
            });
            const body = await response.json();
            if (!response.ok || body.success !== true) {
              throw new Error(`Cloudflare read-only preflight failed at ${path} (HTTP ${response.status})`);
            }
            return body.result;
          }
          const verification = await requireCloudflare('/user/tokens/verify');
          if (verification.status !== 'active') throw new Error('Cloudflare token is not active');
          const account = await requireCloudflare(`/accounts/${encodeURIComponent(accountId)}`);
          if (account.id !== accountId) throw new Error('Cloudflare account ID mismatch');
          const scripts = await requireCloudflare(`/accounts/${encodeURIComponent(accountId)}/workers/scripts`);
          const names = new Set(scripts.map((script) => script.id));
          for (const name of [
            'mbfd-bid-worker-production',
            'mbfd-bid-web-production-opennext',
          ]) {
            if (!names.has(name)) throw new Error(`Expected Cloudflare Worker is not accessible: ${name}`);
          }
          console.log('CLOUDFLARE_CREDENTIAL_PREFLIGHT_PASS: active token, expected account, production Worker/Web resources');
          EOF
      - name: Build shared packages for Wrangler preflight
        run: pnpm -r --filter "./packages/*" build
      - name: Run exact read-only production D1 migration guard
        run: node scripts/assert-production-d1-migration-guard.mjs
      - name: Dry-run production Worker deployment
        run: pnpm --dir apps/worker exec wrangler deploy --env production --dry-run --outdir /tmp/mbfd-bid-worker-preflight
