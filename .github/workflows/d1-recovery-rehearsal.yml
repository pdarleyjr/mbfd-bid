name: D1 recovery rehearsal

on:
  workflow_dispatch:
    inputs:
      source_env:
        description: Source backup environment
        required: true
        default: production
        type: choice
        options:
          - staging
          - production
      snapshot_key:
        description: Exact sanitized R2 SQL snapshot key produced by D1 backup
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: d1-recovery-rehearsal-${{ inputs.source_env }}
  cancel-in-progress: false

env:
  PNPM_VERSION: 9.12.0
  NODE_VERSION: 22.x

jobs:
  restore-and-migrate-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: ${{ inputs.source_env }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SOURCE_ENV: ${{ inputs.source_env }}
      SNAPSHOT_KEY: ${{ inputs.snapshot_key }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore backup into a disposable D1 and rehearse the pending migration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bucket = if ($env:SOURCE_ENV -eq 'production') { 'mbfd-bid-prod-backups' } else { 'mbfd-bid-staging-backups' }
          $database = "mbfd-bid-$($env:SOURCE_ENV)-rehearsal-$env:GITHUB_RUN_ID"
          $created = $false
          $rehearsalConfigPath = $null

          function Invoke-D1Rows([string]$sql) {
            $raw = & pnpm --dir apps/worker exec wrangler d1 execute $database --remote --command $sql --json *>&1
            if ($LASTEXITCODE -ne 0) { throw 'Disposable D1 verification query failed.' }
            $text = $raw | Out-String
            $jsonStart = $text.IndexOf('[')
            if ($jsonStart -lt 0) { throw 'Disposable D1 verification query returned no JSON.' }
            return (($text.Substring($jsonStart) | ConvertFrom-Json -ErrorAction Stop)[0].results)
          }

          function Get-SafeMigrationFailureCategory([object]$value) {
            # Wrangler may include SQL or source data in its diagnostics. Keep
            # that private and publish only a fixed, non-content category.
            $detail = $value | Out-String
            if ($detail -match '(?i)foreign\s+key') { return 'foreign_key' }
            if ($detail -match '(?i)already\s+exists|duplicate\s+(?:column|table|index|trigger)') { return 'already_exists' }
            if ($detail -match '(?i)no\s+such\s+(?:table|column)') { return 'schema_reference' }
            if ($detail -match '(?i)constraint\s+failed|sqlite_constraint') { return 'constraint' }
            if ($detail -match '(?i)syntax\s+error|parse\s+error') { return 'sql_syntax' }
            if ($detail -match '(?i)statement\s+too\s+long|sqlite_toobig') { return 'statement_too_long' }
            if ($detail -match '(?i)not\s+authorized|forbidden|permission\s+denied') { return 'authorization' }
            if ($detail -match '(?i)database\s+(?:is\s+)?(?:locked|busy)') { return 'transient_busy' }
            return 'opaque'
          }

          try {
            $create = & pnpm --dir apps/worker exec wrangler d1 create $database --location enam *>&1
            if ($LASTEXITCODE -ne 0) { throw 'Disposable D1 creation failed.' }
            $created = $true

            # `migrations apply` requires a D1 binding, while the disposable
            # database intentionally is not a persistent project binding.
            # Generate an exact, runner-temporary binding from the created DB
            # UUID, then remove it in finally. It never refers to live D1.
            $info = & pnpm --dir apps/worker exec wrangler d1 info $database --json *>&1
            if ($LASTEXITCODE -ne 0) { throw 'Disposable D1 identifier lookup failed.' }
            try {
              $databaseId = (($info | Out-String) | ConvertFrom-Json -ErrorAction Stop).uuid
            } catch {
              throw 'Disposable D1 identifier lookup returned invalid JSON.'
            }
            if ($databaseId -isnot [string] -or $databaseId -notmatch '^[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}$') {
              throw 'Disposable D1 identifier lookup omitted a valid UUID.'
            }
            $tempRoot = $env:RUNNER_TEMP
            if ([string]::IsNullOrWhiteSpace($tempRoot)) { $tempRoot = [System.IO.Path]::GetTempPath() }
            $rehearsalConfigPath = Join-Path $tempRoot "mbfd-bid-rehearsal-$env:GITHUB_RUN_ID.toml"
            $migrationDirectory = (Resolve-Path -LiteralPath 'apps/worker/migrations').Path.Replace('\', '/')
            [System.IO.File]::WriteAllText($rehearsalConfigPath, @"
          name = "mbfd-bid-rehearsal"
          [[d1_databases]]
          binding = "REHEARSAL_DB"
          database_name = "$database"
          database_id = "$databaseId"
          migrations_dir = "$migrationDirectory"
          "@, [System.Text.UTF8Encoding]::new($false))

            ./scripts/d1-restore.ps1 -Env $env:SOURCE_ENV -DbName $database -BucketName $bucket -SnapshotKey $env:SNAPSHOT_KEY

            $beforeLedger = Invoke-D1Rows 'SELECT COUNT(*) AS migration_count, MAX(name) AS latest_migration FROM d1_migrations;'
            $beforeCounts = Invoke-D1Rows "SELECT (SELECT COUNT(*) FROM sqlite_master WHERE type = 'table' AND name NOT LIKE 'sqlite_%') AS table_count, (SELECT COUNT(*) FROM members) AS members_count, (SELECT COUNT(*) FROM bid_years) AS bid_years_count, (SELECT COUNT(*) FROM bid_sessions) AS bid_sessions_count, (SELECT COUNT(*) FROM audit_log) AS audit_log_count, (SELECT COUNT(*) FROM annual_plan_receipts) AS annual_plan_receipts_count;"
            $beforeQuick = Invoke-D1Rows 'PRAGMA quick_check;'
            $beforeForeignKeys = Invoke-D1Rows 'PRAGMA foreign_key_check;'
            if ($beforeLedger[0].migration_count -ne 67 -or $beforeLedger[0].latest_migration -ne '0067_bid_evidence_insert_seals.sql' -or $beforeQuick[0].quick_check -ne 'ok' -or $beforeForeignKeys.Count -ne 0) {
              throw 'Restored source snapshot did not satisfy the pre-migration integrity gate.'
            }

            $apply = & pnpm --dir apps/worker exec wrangler d1 migrations apply REHEARSAL_DB --remote --config $rehearsalConfigPath *>&1
            if ($LASTEXITCODE -ne 0) {
              $category = Get-SafeMigrationFailureCategory $apply
              throw "Disposable D1 migration apply failed (category=$category)."
            }

            $afterLedger = Invoke-D1Rows 'SELECT COUNT(*) AS migration_count, MAX(name) AS latest_migration FROM d1_migrations;'
            $afterCounts = Invoke-D1Rows "SELECT (SELECT COUNT(*) FROM sqlite_master WHERE type = 'table' AND name NOT LIKE 'sqlite_%') AS table_count, (SELECT COUNT(*) FROM members) AS members_count, (SELECT COUNT(*) FROM bid_years) AS bid_years_count, (SELECT COUNT(*) FROM bid_sessions) AS bid_sessions_count, (SELECT COUNT(*) FROM audit_log) AS audit_log_count, (SELECT COUNT(*) FROM annual_plan_receipts) AS annual_plan_receipts_count, (SELECT COUNT(*) FROM sqlite_master WHERE type = 'table' AND name = 'annual_bid_structure_clone_state') AS clone_state_table_count;"
            $afterQuick = Invoke-D1Rows 'PRAGMA quick_check;'
            $afterForeignKeys = Invoke-D1Rows 'PRAGMA foreign_key_check;'
            $coreCountsPreserved = ($beforeCounts[0].members_count -eq $afterCounts[0].members_count) -and ($beforeCounts[0].bid_years_count -eq $afterCounts[0].bid_years_count) -and ($beforeCounts[0].bid_sessions_count -eq $afterCounts[0].bid_sessions_count) -and ($beforeCounts[0].audit_log_count -eq $afterCounts[0].audit_log_count) -and ($beforeCounts[0].annual_plan_receipts_count -eq $afterCounts[0].annual_plan_receipts_count)
            $tableDeltaCorrect = ($afterCounts[0].table_count -eq ($beforeCounts[0].table_count + 1)) -and ($afterCounts[0].clone_state_table_count -eq 1)
            $postIntegrity = ($afterQuick[0].quick_check -eq 'ok') -and ($afterForeignKeys.Count -eq 0)
            if ($afterLedger[0].migration_count -ne 68 -or $afterLedger[0].latest_migration -ne '0068_annual_bid_structure_clone_state.sql' -or -not $coreCountsPreserved -or -not $tableDeltaCorrect -or -not $postIntegrity) {
              throw 'Disposable D1 post-migration verification failed.'
            }
            Write-Host "[d1-rehearsal] PASS: restored ledger 67, applied 0068, preserved aggregate core counts, and passed quick/foreign-key integrity checks."
          } finally {
            if ($null -ne $rehearsalConfigPath -and (Test-Path -LiteralPath $rehearsalConfigPath)) {
              Remove-Item -LiteralPath $rehearsalConfigPath -Force
            }
            if ($created) {
              $delete = & pnpm --dir apps/worker exec wrangler d1 delete $database --skip-confirmation *>&1
              if ($LASTEXITCODE -ne 0) { throw 'Disposable D1 cleanup failed.' }
              Write-Host '[d1-rehearsal] disposable database removed.'
            }
          }
