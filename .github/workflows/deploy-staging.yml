name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  PNPM_VERSION: 9.12.0
  NODE_VERSION: 22.x

permissions:
  contents: read
  deployments: write

jobs:
  deploy-worker:
    name: Deploy worker (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://api.staging.bid.mbfdhub.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mbfd/shared build
      - name: Apply D1 migrations (staging, remote)
        working-directory: apps/worker
        run: pnpm exec wrangler d1 migrations apply mbfd-bid-staging --remote --env staging
      - name: Deploy worker
        working-directory: apps/worker
        run: pnpm exec wrangler deploy --env staging

  deploy-web:
    name: Deploy web (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: deploy-worker
    environment:
      name: staging
      url: https://staging.bid.mbfdhub.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mbfd/shared build
      - name: Deploy Next.js to Cloudflare Workers (+ Static Assets)
        working-directory: apps/web
        # OpenNext 1.x deploys to Workers + Static Assets (replaces the old
        # Pages flow). `pnpm deploy:staging` chains build && deploy. The
        # custom domain staging.bid.mbfdhub.com is auto-provisioned by the
        # `routes` block in wrangler.jsonc. NEXT_PUBLIC_* is baked into the
        # client bundle at build time, so it must be set on the build step.
        env:
          NEXT_PUBLIC_WORKER_BASE: https://api.staging.bid.mbfdhub.com
        run: pnpm deploy:staging
