name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  PNPM_VERSION: 9.12.0
  NODE_VERSION: 22.x

permissions:
  contents: read
  deployments: write

jobs:
  deploy-worker:
    name: Deploy worker (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://api.staging.bid.mbfdhub.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build internal packages
        run: pnpm -r --filter "./packages/*" build
      - name: Apply D1 migrations (staging, remote)
        working-directory: apps/worker
        run: pnpm exec wrangler d1 migrations apply mbfd-bid-staging --remote --env staging
      # Reference-data seeding is deliberately excluded from deployment.
      # The seed replaces records and must be a separately reviewed,
      # export-backed staging operation.
      - name: Deploy worker
        working-directory: apps/worker
        run: pnpm exec wrangler deploy --env staging

  deploy-web:
    name: Deploy web (OpenNext Worker, staging)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: deploy-worker
    environment:
      name: staging
      url: https://staging.bid.mbfdhub.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build internal packages
        run: pnpm -r --filter "./packages/*" build
      - name: Build and deploy OpenNext Worker (staging only)
        working-directory: apps/web
        # `deploy:staging` hard-codes the staging API build target and runs
        # OpenNext's Worker deploy with `--env staging`; it has no Pages,
        # dirty-commit, or production path.
        env:
          NEXT_PUBLIC_WORKER_BASE: https://api.staging.bid.mbfdhub.com
        run: pnpm deploy:staging
