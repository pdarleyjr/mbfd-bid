name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  PNPM_VERSION: 9.12.0
  NODE_VERSION: 22.x

permissions:
  contents: read
  deployments: write

jobs:
  validate-artifacts:
    name: Validate staging artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Build internal packages
        run: pnpm -r --filter "./packages/*" build
      - run: pnpm typecheck
      - name: Build and smoke Worker locally without remote deployment
        working-directory: apps/worker
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler dev --env staging --local --ip 127.0.0.1 --port 8788 --persist-to .wrangler/ci-state --log-level error > worker-dev.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8788/api/health; then
              exit 0
            fi
            sleep 1
          done
          cat worker-dev.log
          exit 1
      - name: Build OpenNext staging artifact without deploy
        working-directory: apps/web
        env:
          NEXT_PUBLIC_WORKER_BASE: https://api.staging.bid.mbfdhub.com
        run: pnpm build:opennext:staging

  deploy-worker:
    name: Deploy worker (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate-artifacts
    environment:
      name: staging
      url: https://api.staging.bid.mbfdhub.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build internal packages
        run: pnpm -r --filter "./packages/*" build
      - name: Require controlled D1 migration gate
        # Ordinary deployment never applies D1 migrations. The Release Captain
        # completes the separately authorized, per-migration procedure first;
        # this read-only ledger check fails closed until that procedure is done.
        run: node scripts/assert-staging-d1-migration-guard.mjs
      - name: Deploy worker
        working-directory: apps/worker
        run: pnpm exec wrangler deploy --env staging

  deploy-web:
    name: Deploy web (OpenNext Worker, staging)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [validate-artifacts, deploy-worker]
    environment:
      name: staging
      url: https://staging.bid.mbfdhub.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build internal packages
        run: pnpm -r --filter "./packages/*" build
      - name: Build and deploy OpenNext Worker (staging only)
        working-directory: apps/web
        # `deploy:staging` hard-codes the staging API build target and runs
        # OpenNext's Worker deploy with `--env staging`; it has no Pages,
        # dirty-commit, or production path.
        env:
          NEXT_PUBLIC_WORKER_BASE: https://api.staging.bid.mbfdhub.com
        run: pnpm deploy:staging
