name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  PNPM_VERSION: 9.12.0
  NODE_VERSION: 22.x

permissions:
  contents: read
  deployments: write

jobs:
  deploy-worker:
    name: Deploy worker (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://api.staging.bid.mbfdhub.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v6
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build internal packages
        run: pnpm -r --filter "./packages/*" build
      - name: Generate AI rulebook constant
        run: pnpm --filter @mbfd/worker ai:codegen
      - name: Apply D1 migrations (staging, remote)
        working-directory: apps/worker
        run: pnpm exec wrangler d1 migrations apply mbfd-bid-staging --remote --env staging
      - name: Deploy worker
        working-directory: apps/worker
        run: pnpm exec wrangler deploy --env staging

  deploy-web:
    name: Deploy web (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: deploy-worker
    environment:
      name: staging
      url: https://staging.bid.mbfdhub.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v6
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build internal packages
        run: pnpm -r --filter "./packages/*" build
      - name: Generate AI rulebook constant
        # Next.js type-checks worker imports transitively, so the generated
        # ./rulebook-2026.generated.ts must exist before `next build`.
        run: pnpm --filter @mbfd/worker ai:codegen
      - name: Build and deploy Next.js to Cloudflare Pages
        working-directory: apps/web
        # next-on-pages calls `vercel build` internally and outputs to
        # .vercel/output/static. We then push that directly to Pages.
        # NEXT_PUBLIC_* vars are baked into the client bundle at build time.
        env:
          NEXT_PUBLIC_WORKER_BASE: https://api.staging.bid.mbfdhub.com
        run: pnpm deploy:staging
