name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 9.12.0
  NODE_VERSION: 22.x

jobs:
  lint-and-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Build all internal packages first so `tsc --noEmit` in dependent
      # packages can resolve workspace deps via their dist/ exports.
      - run: pnpm -r --filter "./packages/*" build
      - run: pnpm typecheck

  unit-and-integration:
    name: Unit + Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build OpenNext production artifact (non-deploy)
        working-directory: apps/web
        # Build the actual release configuration without remote access.
        # No deployment or Cloudflare/D1/Hub mutation occurs in this step.
        env:
          NEXT_PUBLIC_WORKER_BASE: https://api.bid.mbfdhub.com
        run: pnpm build:opennext:production
      - name: Smoke isolated local Worker
        working-directory: apps/worker
        shell: bash
        run: |
          set -euo pipefail
          test_key="$(openssl rand -hex 32)"
          pnpm exec wrangler dev --config wrangler.test.toml --local --ip 127.0.0.1 --port 8788 --persist-to .wrangler/ci-test-state --log-level error --var "JWT_SIGNING_KEY:$test_key" --var "PORTAL_BID_FEDERATION_TOKEN:test-fixture-only" > worker-local.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8788/api/health | node --input-type=module -e 'let data=""; for await (const part of process.stdin) data+=part; const body=JSON.parse(data); if(body.ok!==true || body.env!=="test") process.exit(1);'; then
              exit 0
            fi
            sleep 1
          done
          cat worker-local.log
          exit 1
      - name: Verify D1 backup preflight
        shell: pwsh
        run: ./scripts/test-d1-backup-preflight.ps1
      - name: Verify retired environment cannot be deployed or used by tests
        run: node scripts/test-staging-retirement.mjs
      - name: Verify production release workflow guard
        run: node scripts/test-deploy-production-migration-guard.mjs
      - run: pnpm test
      - name: Verify Workers D1 and Durable Object runtime
        run: pnpm --filter @mbfd/worker test:runtime

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_REAL_JWT: '1'
      E2E_USE_BUILT_WEB: '1'
      NEXT_PUBLIC_WORKER_BASE: http://127.0.0.1:31987
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
      - name: Create isolated browser-test signing key
        shell: bash
        run: echo "JWT_SIGNING_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Build all internal packages for the browser and isolated Worker
        run: pnpm -r --filter "./packages/*" build
      - name: Build production-mode web artifact for browser tests
        run: pnpm --filter @mbfd/web build
      - run: pnpm --filter @mbfd/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 7
