name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # E2E job is manual-only via workflow_dispatch until seeded staging
  # fixtures + memberA.json storage state are wired (Plan 09 hardening).
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Run Playwright E2E against staging fixtures'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 9.12.0
  NODE_VERSION: 22.x

jobs:
  lint-and-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Build all internal packages first so `tsc --noEmit` in dependent
      # packages can resolve workspace deps via their dist/ exports.
      - run: pnpm -r --filter "./packages/*" build
      - name: AI rulebook codegen
        run: pnpm --filter @mbfd/worker ai:codegen
      - run: pnpm typecheck

  unit-and-integration:
    name: Unit + Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Codegen must run BEFORE build because apps/web imports the generated
      # rulebook file at type-check / next-build time.
      - name: AI rulebook codegen
        run: pnpm --filter @mbfd/worker ai:codegen
      - run: pnpm build
      - run: pnpm test

  e2e:
    name: Playwright E2E
    # Plan 04/07 E2E specs are infrastructure-gated until staging is seeded
    # with members + an active session + memberA.json storage state. Run
    # manually via workflow_dispatch once those fixtures exist.
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JWT_SIGNING_KEY: ${{ secrets.E2E_JWT_SIGNING_KEY }}
      PIN_PLAIN: '2300'
      E2E_REAL_JWT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mbfd/shared build
      - run: pnpm --filter @mbfd/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
